<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Studio</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h1, h2 { color: #2c3e50; text-align: center; }
    .section { margin-bottom: 30px; padding: 15px; border-bottom: 1px solid #eee; }
    .form-group { margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
    input, select, button { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    input, select { flex: 1; min-width: 150px; }
    button { background-color: #3498db; color: white; border: none; cursor: pointer; transition: 0.2s; }
    button:hover { background-color: #2980b9; }
    ul { list-style: none; padding: 0; }
    li { background: #f9f9f9; padding: 10px; margin-bottom: 8px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
    .progress-bar-container { background: #e0e0e0; border-radius: 10px; height: 20px; width: 100%; overflow: hidden; margin-top: 10px; }
    .progress-bar { background: #2ecc71; height: 100%; width: 0%; transition: width 0.3s; }
    .badge { background: #e74c3c; color: white; padding: 3px 8px; border-radius: 12px; font-size: 12px; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Study Studio</h1>

    <!-- Target Goal Section -->
    <div class="section">
      <h2>Target Goal</h2>
      <div class="form-group">
        <label for="targetInput" style="align-self: center;">Set Target Goal (%):</label>
        <input type="number" id="targetInput" value="85" min="0" max="100" onchange="updateTarget()">
      </div>
      <p>Current Average Score: <strong id="avgScore">0%</strong> / Target: <strong id="currentTargetDisplay">85%</strong></p>
      <div class="progress-bar-container">
        <div id="progressBar" class="progress-bar"></div>
      </div>
    </div>

    <!-- Tasks Section -->
    <div class="section">
      <h2>Tasks</h2>
      <div class="form-group">
        <input type="text" id="taskInput" placeholder="Task description...">
        <select id="taskSubject">
          <option value="Math">Math</option>
          <option value="Science">Science</option>
          <option value="English">English</option>
          <option value="History">History</option>
          <option value="Other">Other</option>
        </select>
        <button onclick="addTask()">Add Task</button>
      </div>
      <ul id="taskList"></ul>
    </div>

    <!-- Test Scores Section -->
    <div class="section">
      <h2>Test Scores</h2>
      <div class="form-group">
        <select id="scoreSubject">
          <option value="Math">Math</option>
          <option value="Science">Science</option>
          <option value="English">English</option>
          <option value="History">History</option>
          <option value="Other">Other</option>
        </select>
        <input type="number" id="scoreInput" placeholder="Score (%)" min="0" max="100">
        <button onclick="addScore()">Add Score</button>
      </div>
      <ul id="scoreList"></ul>
    </div>
  </div>

  <script>
    let scores = [];

    function updateTarget() {
      const targetVal = document.getElementById('targetInput').value || 0;
      document.getElementById('currentTargetDisplay').innerText = targetVal + '%';
      calculateAverage();
    }

    function addTask() {
      const input = document.getElementById('taskInput');
      const subject = document.getElementById('taskSubject').value;
      if (!input.value.trim()) return;

      const ul = document.getElementById('taskList');
      const li = document.createElement('li');
      li.innerHTML = `<span>${input.value}</span> <span class="badge">${subject}</span>`;
      li.onclick = function() { this.remove(); };
      ul.appendChild(li);
      input.value = '';
    }

    function addScore() {
      const input = document.getElementById('scoreInput');
      const subject = document.getElementById('scoreSubject').value;
      const val = parseFloat(input.value);
      if (isNaN(val)) return;

      scores.push(val);
      const ul = document.getElementById('scoreList');
      const li = document.createElement('li');
      li.innerHTML = `<span>${subject} Test</span> <strong>${val}%</strong>`;
      ul.appendChild(li);
      
      input.value = '';
      calculateAverage();
    }

    function calculateAverage() {
      if (scores.length === 0) return;
      const sum = scores.reduce((a, b) => a + b, 0);
      const avg = (sum / scores.length).toFixed(1);
      const target = parseFloat(document.getElementById('targetInput').value) || 100;
      
      document.getElementById('avgScore').innerText = avg + '%';
      
      const percentageOfTarget = Math.min((avg / target) * 100, 100);
      document.getElementById('progressBar').style.width = percentageOfTarget + '%';
    }
  </script>
</body>
</html>
